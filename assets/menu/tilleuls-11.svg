<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842" role="img"><rect width="595" height="842" fill="#fbfaf6"/><rect x="20" y="20" width="555" height="802" fill="none" stroke="#77982e" stroke-width=".8" opacity=".35"/><g transform="translate(0,0)"><text x="298" y="80" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5d7a22" text-anchor="middle" font-weight="600" letter-spacing="3.4">BON À SAVOIR</text><line x1="233.5" y1="91" x2="283.5" y2="91" stroke="#77982e" stroke-width=".8" opacity=".55"/><line x1="311.5" y1="91" x2="361.5" y2="91" stroke="#77982e" stroke-width=".8" opacity=".55"/><g transform="translate(298,91)" fill="#77982e" opacity=".85"><path d="M0,-5 C4,-3 5,1 0,5 C-5,1 -4,-3 0,-5 Z"/><line x1="0" y1="-4" x2="0" y2="4" stroke="#fbfaf6" stroke-width=".7"/></g><text x="54" y="110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5c4034" text-anchor="start" font-weight="600" letter-spacing=".4">Eau</text><text x="54" y="125" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Carafe ou verre d’eau gratuit sur demande.</text><text x="54" y="149" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5c4034" text-anchor="start" font-weight="600" letter-spacing=".4">Viandes</text><text x="54" y="164" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">L’origine de nos viandes bovines est affichée dans le restaurant. Les poids indiqués sont avant</text><text x="54" y="178" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">cuisson et peuvent varier de plus ou moins 10 %.</text><text x="54" y="202" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5c4034" text-anchor="start" font-weight="600" letter-spacing=".4">Allergènes</text><text x="54" y="217" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Consultez l’information disponible à l’accueil du restaurant.</text><text x="54" y="241" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5c4034" text-anchor="start" font-weight="600" letter-spacing=".4">Bio</text><text x="54" y="256" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">AB : produits issus de l’agriculture biologique.</text><text x="54" y="280" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5c4034" text-anchor="start" font-weight="600" letter-spacing=".4">Alcool</text><text x="54" y="295" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">L’abus d’alcool est dangereux pour la santé. À consommer avec modération.</text><text x="54" y="319" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5c4034" text-anchor="start" font-weight="600" letter-spacing=".4">Engagement</text><text x="54" y="334" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Nous promouvons une alimentation équilibrée et des filières d’achat responsables. Parce que chaque</text><text x="54" y="348" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">geste compte, notre restaurant agit pour une hospitalité positive.</text><text x="54" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#5c4034" text-anchor="start" font-weight="600" letter-spacing=".4">Prix</text><text x="54" y="387" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Tous nos prix sont en euros, nets TTC, service compris.</text><line x1="257.5" y1="692" x2="337.5" y2="692" stroke="#77982e" stroke-width=".8" opacity=".5"/><text x="298" y="726" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#23281e" text-anchor="middle" font-weight="normal" letter-spacing="0">Merci de votre visite</text><text x="54" y="752" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0"></text><text x="298" y="770" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f7566" text-anchor="middle" font-weight="normal" letter-spacing="0">Votre avis nous aide beaucoup : touchez l’étoile en haut de l’écran.</text></g><text x="297.5" y="800" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6f7566" text-anchor="middle" letter-spacing="1.6">11 / 11</text><text x="297.5" y="784" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" fill="#6f7566" text-anchor="middle" letter-spacing="2.2" opacity=".75">BON À SAVOIR</text></svg>