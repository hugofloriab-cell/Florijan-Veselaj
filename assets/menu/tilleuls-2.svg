<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842" role="img"><rect width="595" height="842" fill="#fbfaf6"/><rect x="20" y="20" width="555" height="802" fill="none" stroke="#77982e" stroke-width=".8" opacity=".35"/><g transform="translate(0,90)"><text x="298" y="80" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5d7a22" text-anchor="middle" font-weight="600" letter-spacing="3.4">BIENVENUE</text><line x1="233.5" y1="91" x2="283.5" y2="91" stroke="#77982e" stroke-width=".8" opacity=".55"/><line x1="311.5" y1="91" x2="361.5" y2="91" stroke="#77982e" stroke-width=".8" opacity=".55"/><g transform="translate(298,91)" fill="#77982e" opacity=".85"><path d="M0,-5 C4,-3 5,1 0,5 C-5,1 -4,-3 0,-5 Z"/><line x1="0" y1="-4" x2="0" y2="4" stroke="#fbfaf6" stroke-width=".7"/></g><text x="54" y="110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Notre équipe est ravie de vous proposer sa carte du moment.</text><text x="54" y="132" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Nos plats sont élaborés à partir de produits frais et de saison. Ils évoluent au fil des jours</text><text x="54" y="147" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">et des semaines, selon le marché et l’inspiration du moment.</text><text x="54" y="170" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">N’hésitez pas à consulter notre équipe et le tableau des suggestions.</text><text x="54" y="192" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Une carte de pizzas et d’en-cas reste disponible en journée et la nuit.</text><text x="298" y="226" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5d7a22" text-anchor="middle" font-weight="600" letter-spacing="3.4">NOS FORMULES</text><line x1="233.5" y1="237.5" x2="283.5" y2="237.5" stroke="#77982e" stroke-width=".8" opacity=".55"/><line x1="311.5" y1="237.5" x2="361.5" y2="237.5" stroke="#77982e" stroke-width=".8" opacity=".55"/><g transform="translate(298,238)" fill="#77982e" opacity=".85"><path d="M0,-5 C4,-3 5,1 0,5 C-5,1 -4,-3 0,-5 Z"/><line x1="0" y1="-4" x2="0" y2="4" stroke="#fbfaf6" stroke-width=".7"/></g><text x="67" y="256" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#23281e" text-anchor="start" font-weight="bold" letter-spacing="0">Formule Duo</text><text x="541" y="256" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#5d7a22" text-anchor="end" font-weight="bold" letter-spacing="0">19 €</text><line x1="152" y1="252.5" x2="502" y2="252.5" stroke="#6f7566" stroke-width=".7" opacity=".35" stroke-dasharray="1 3"/><text x="67" y="272" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Entrée + plat, ou plat + dessert</text><text x="67" y="294" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#23281e" text-anchor="start" font-weight="bold" letter-spacing="0">Formule Trio</text><text x="541" y="294" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#5d7a22" text-anchor="end" font-weight="bold" letter-spacing="0">24 €</text><line x1="159" y1="289.5" x2="502" y2="289.5" stroke="#6f7566" stroke-width=".7" opacity=".35" stroke-dasharray="1 3"/><text x="67" y="308" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Entrée + plat + dessert</text><text x="67" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#23281e" text-anchor="start" font-weight="bold" letter-spacing="0">Menu Enfant</text><text x="541" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#5d7a22" text-anchor="end" font-weight="bold" letter-spacing="0">12 €</text><line x1="152" y1="326.5" x2="502" y2="326.5" stroke="#6f7566" stroke-width=".7" opacity=".35" stroke-dasharray="1 3"/><text x="67" y="346" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Jusqu’à 11 ans inclus</text><text x="54" y="370" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">· Formules valables le soir, hors « incontournables ».</text><text x="54" y="383" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">· Un incontournable dans la formule ? C’est possible, avec un supplément de 7 €.</text><text x="54" y="397" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">· Supplément frites maison ou salade verte : 5 €.</text><text x="54" y="427" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5c4034" text-anchor="start" font-weight="600" letter-spacing=".6">Le menu enfant comprend</text><line x1="54" y1="432.90000000000003" x2="541" y2="432.90000000000003" stroke="#5c4034" stroke-width=".6" opacity=".3"/><text x="54" y="449" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#23281e" text-anchor="start" font-weight="bold" letter-spacing="0">Un plat au choix</text><text x="54" y="462" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Steak haché pur bœuf · Aiguillettes de poulet panées aux céréales · Plat du jour</text><text x="54" y="480" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#23281e" text-anchor="start" font-weight="bold" letter-spacing="0">Un dessert au choix</text><text x="54" y="493" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Une boule de glace ou de sorbet · Fromage blanc · Compote</text><text x="54" y="511" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#23281e" text-anchor="start" font-weight="bold" letter-spacing="0">Une boisson au choix</text><text x="54" y="524" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Un verre de sirop · Un verre de limonade</text></g><text x="297.5" y="800" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6f7566" text-anchor="middle" letter-spacing="1.6">2 / 13</text><text x="297.5" y="784" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" fill="#6f7566" text-anchor="middle" letter-spacing="2.2" opacity=".75">NOS FORMULES</text></svg>