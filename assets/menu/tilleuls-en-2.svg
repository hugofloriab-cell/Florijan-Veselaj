<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842" role="img"><rect width="595" height="842" fill="#fbfaf6"/><rect x="20" y="20" width="555" height="802" fill="none" stroke="#77982e" stroke-width=".8" opacity=".35"/><g transform="translate(0,90)"><text x="298" y="80" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5d7a22" text-anchor="middle" font-weight="600" letter-spacing="3.4">WELCOME</text><line x1="233.5" y1="91" x2="283.5" y2="91" stroke="#77982e" stroke-width=".8" opacity=".55"/><line x1="311.5" y1="91" x2="361.5" y2="91" stroke="#77982e" stroke-width=".8" opacity=".55"/><g transform="translate(298,91)" fill="#77982e" opacity=".85"><path d="M0,-5 C4,-3 5,1 0,5 C-5,1 -4,-3 0,-5 Z"/><line x1="0" y1="-4" x2="0" y2="4" stroke="#fbfaf6" stroke-width=".7"/></g><text x="54" y="110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Our team is delighted to share the menu of the moment with you.</text><text x="54" y="132" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Our dishes are made with fresh, seasonal produce. They change from day to day and week to week,</text><text x="54" y="147" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">with the market and the inspiration of the moment.</text><text x="54" y="170" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Do ask our team, and have a look at the suggestions board.</text><text x="54" y="192" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">A pizza and snack menu is also served during the day and at night.</text><text x="298" y="226" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5d7a22" text-anchor="middle" font-weight="600" letter-spacing="3.4">SET MENUS</text><line x1="233.5" y1="237.5" x2="283.5" y2="237.5" stroke="#77982e" stroke-width=".8" opacity=".55"/><line x1="311.5" y1="237.5" x2="361.5" y2="237.5" stroke="#77982e" stroke-width=".8" opacity=".55"/><g transform="translate(298,238)" fill="#77982e" opacity=".85"><path d="M0,-5 C4,-3 5,1 0,5 C-5,1 -4,-3 0,-5 Z"/><line x1="0" y1="-4" x2="0" y2="4" stroke="#fbfaf6" stroke-width=".7"/></g><text x="67" y="256" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#23281e" text-anchor="start" font-weight="bold" letter-spacing="0">Two courses</text><text x="541" y="256" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#5d7a22" text-anchor="end" font-weight="bold" letter-spacing="0">€19</text><line x1="152" y1="252.5" x2="509" y2="252.5" stroke="#6f7566" stroke-width=".7" opacity=".35" stroke-dasharray="1 3"/><text x="67" y="272" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Starter + main, or main + dessert</text><text x="67" y="294" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#23281e" text-anchor="start" font-weight="bold" letter-spacing="0">Three courses</text><text x="541" y="294" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#5d7a22" text-anchor="end" font-weight="bold" letter-spacing="0">€24</text><line x1="166" y1="289.5" x2="509" y2="289.5" stroke="#6f7566" stroke-width=".7" opacity=".35" stroke-dasharray="1 3"/><text x="67" y="308" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Starter + main + dessert</text><text x="67" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#23281e" text-anchor="start" font-weight="bold" letter-spacing="0">Children’s menu</text><text x="541" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#5d7a22" text-anchor="end" font-weight="bold" letter-spacing="0">€12</text><line x1="180" y1="326.5" x2="509" y2="326.5" stroke="#6f7566" stroke-width=".7" opacity=".35" stroke-dasharray="1 3"/><text x="67" y="346" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Up to 11 years old</text><text x="54" y="370" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">· Set menus are served in the evening; signature dishes are excluded.</text><text x="54" y="383" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">· A signature dish within the set menu? Certainly — €7 supplement.</text><text x="54" y="397" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.8" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">· Homemade fries or green salad: €5 supplement.</text><text x="54" y="427" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#5c4034" text-anchor="start" font-weight="600" letter-spacing=".6">The children’s menu includes</text><line x1="54" y1="432.90000000000003" x2="541" y2="432.90000000000003" stroke="#5c4034" stroke-width=".6" opacity=".3"/><text x="54" y="449" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#23281e" text-anchor="start" font-weight="bold" letter-spacing="0">One main of your choice</text><text x="54" y="462" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">Pure beef burger steak · Breaded chicken goujons · Dish of the day</text><text x="54" y="480" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#23281e" text-anchor="start" font-weight="bold" letter-spacing="0">One dessert of your choice</text><text x="54" y="493" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">One scoop of ice cream or sorbet · Fromage blanc · Fruit compote</text><text x="54" y="511" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#23281e" text-anchor="start" font-weight="bold" letter-spacing="0">One drink of your choice</text><text x="54" y="524" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" fill="#6f7566" text-anchor="start" font-weight="normal" letter-spacing="0">A glass of cordial · A glass of lemonade</text></g><text x="297.5" y="800" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9.5" fill="#6f7566" text-anchor="middle" letter-spacing="1.6">2 / 13</text><text x="297.5" y="784" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" fill="#6f7566" text-anchor="middle" letter-spacing="2.2" opacity=".75">SET MENUS</text></svg>