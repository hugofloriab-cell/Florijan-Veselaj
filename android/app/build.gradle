plugins {
    id "com.android.application"
}

android {
    namespace "fr.tvkosova.app"
    compileSdk 34

    defaultConfig {
        applicationId "fr.tvkosova.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signée avec la clé de débogage générée sur le serveur de build :
            // aucune clé secrète dans le dépôt. Conséquence : pour installer une
            // nouvelle version, désinstaller d'abord l'ancienne.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
