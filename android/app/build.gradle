plugins {
    id "com.android.application"
}

android {
    namespace "fr.tvkosova.app"
    compileSdk 34

    defaultConfig {
        applicationId "fr.tvkosova.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signée avec la clé de débogage générée sur le serveur de build :
            // aucune clé secrète dans le dépôt. Conséquence : pour installer une
            // nouvelle version, désinstaller d'abord l'ancienne.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Lecteur vidéo natif d'Android : décode les flux de télé (entrelacés,
    // haut débit) que le lecteur web des télés n'affiche pas.
    def media3 = "1.4.1"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
}
