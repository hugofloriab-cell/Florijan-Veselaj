# Publie la check-list petit déjeuner sur GitHub Pages.
# Active le site au premier passage (enablement), puis met en ligne le
# contenu de docs/ à chaque modification de main.
name: Publier la check-list

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Activer et configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparer le contenu de docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4
