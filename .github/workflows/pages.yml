# Publie la check-list petit déjeuner sur GitHub Pages.
#
# Prérequis, à faire une seule fois dans les réglages du dépôt :
#   Settings -> Pages -> Source -> GitHub Actions
# (le jeton des Actions ne peut pas créer le site lui-même : l'API répond
#  « Resource not accessible by integration ».)
#
# Ensuite, chaque modification de docs/ sur main met le site à jour.
name: Publier la check-list

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Préparer le contenu de docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4
