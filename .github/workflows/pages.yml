# Publie le site (docs/) sur GitHub Pages : la check-list petit déjeuner
# et TV Kosova, avec l'appli Android TV construite depuis android/.
#
# Prérequis, à faire une seule fois dans les réglages du dépôt :
#   Settings -> Pages -> Source -> GitHub Actions
# (le jeton des Actions ne peut pas créer le site lui-même : l'API répond
#  « Resource not accessible by integration ».)
#
# Chaque modification de docs/ ou android/ sur main met le site à jour.
# Sur une pull request, l'appli est seulement construite, pour vérifier
# qu'elle compile ; rien n'est publié.
name: Publier la check-list

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "android/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "android/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Sur main, un échec de l'appli ne doit pas empêcher la check-list d'être
      # publiée : le site part alors sans l'appli. Sur une PR, l'échec se voit.
      - name: Construire l'appli Android TV
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: |
          gradle -p android assembleRelease --no-daemon
          cp android/app/build/outputs/apk/release/app-release.apk docs/tv/tv-kosova.apk
          ls -l docs/tv/tv-kosova.apk

      - name: Garder l'appli (téléchargeable depuis la page du workflow)
        uses: actions/upload-artifact@v4
        with:
          name: tv-kosova-apk
          path: docs/tv/tv-kosova.apk
          if-no-files-found: warn

      - name: Configurer Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Préparer le contenu de docs/
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  publier:
    needs: construire
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4
