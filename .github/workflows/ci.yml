name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  database:
    name: Migrations & sécurité
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Client PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # Applique les migrations depuis zéro, puis vérifie les invariants de
      # sécurité : isolation RLS entre utilisateurs, impossibilité de générer
      # sans crédits, ledger append-only, remboursements idempotents.
      - name: Migrations sur base vierge + tests de sécurité
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/postgres
        run: ./supabase/tests/run.sh

  functions:
    name: Edge Functions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck
        working-directory: supabase/functions
        run: deno task check

      - name: Lint
        working-directory: supabase/functions
        run: deno task lint

  ios-spike:
    name: Spike audio (compilation)
    runs-on: macos-latest
    # Filtré par chemin : les minutes macOS sont facturées 10× sur un dépôt
    # privé, ce job ne doit tourner que quand le paquet Swift change.
    if: contains(github.event.head_commit.modified, 'ios/') || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      # Compilation seule, pas `swift test` : le harnais joue réellement de
      # l'audio et mesure une dérive d'horloge. Un runner sans sortie audio
      # produirait soit un échec, soit — pire — un chiffre qui ne veut rien
      # dire. La mesure se fait sur iPhone physique, à la main.
      - name: Build
        working-directory: ios/StemPlayerSpike
        run: swift build --build-tests
