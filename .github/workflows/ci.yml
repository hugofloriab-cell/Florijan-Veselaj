name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  database:
    name: Migrations & sécurité
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Client PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # Applique les migrations depuis zéro, puis vérifie les invariants de
      # sécurité : isolation RLS entre utilisateurs, impossibilité de générer
      # sans crédits, ledger append-only, remboursements idempotents.
      - name: Migrations sur base vierge + tests de sécurité
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/postgres
        run: ./supabase/tests/run.sh
