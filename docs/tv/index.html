<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TV Kosova">
<title>TV Kosova</title>
<style>
:root {
  --fond: #070b14; --panneau: rgba(10, 16, 30, .94); --ligne: rgba(255,255,255,.08);
  --texte: #eef2f8; --doux: #95a3ba; --accent: #f0b429; --rouge: #ef4444;
  --largeur-liste: min(440px, 36vw);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--fond); color: var(--texte);
  font: 17px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }

/* ----- écran de télé : vidéo plein écran, liste par-dessus ----- */
.app { position: relative; height: 100vh; height: 100dvh; }
main { position: absolute; inset: 0; background: #000; }
video { width: 100%; height: 100%; display: block; background: #000; object-fit: contain; }

aside { position: absolute; z-index: 2; top: 0; bottom: 0; left: 0; width: var(--largeur-liste);
  display: flex; flex-direction: column; min-height: 0; overflow-y: auto; scrollbar-width: none;
  background: linear-gradient(90deg, rgba(7,11,20,.97) 60%, rgba(7,11,20,.88));
  box-shadow: 12px 0 40px rgba(0,0,0,.45);
  transition: transform .25s ease, visibility 0s; }
.app.cache-liste aside { transform: translateX(-105%); visibility: hidden;
  transition: transform .25s ease, visibility 0s .25s; }

aside::-webkit-scrollbar { display: none; }
.entete { padding: 20px 22px 12px; }
.entete h1 { font-size: 26px; margin: 0; letter-spacing: .3px; white-space: nowrap; }
.entete h1 span { color: var(--accent); }
.entete .aide { display: block; color: var(--doux); font-size: 13px; margin-top: 2px; }
.filtres { padding: 0 22px 12px; display: grid; gap: 8px; }
.filtres input, .filtres select { width: 100%; padding: 10px 12px; border-radius: 10px;
  border: 2px solid transparent; background: rgba(255,255,255,.07); }
.filtres input:focus, .filtres select:focus { outline: none; border-color: var(--accent); }
ul { list-style: none; margin: 0; padding: 4px 12px 16px; flex: 1 0 auto; }
li button { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
  padding: 10px 12px; border: 0; border-radius: 12px; background: none; cursor: pointer;
  transition: background .12s, transform .12s; }
li button:hover { background: rgba(255,255,255,.06); }
li button:focus-visible, li button:focus { outline: none; background: var(--accent); color: #111; transform: scale(1.02); }
li button:focus .num, li button:focus .groupe { color: #3b2a00; }
li button[aria-current="true"] .nom::before { content: "▶ "; color: var(--rouge); font-size: .8em; }
li button:focus[aria-current="true"] .nom::before { color: #7a1010; }
.num { color: var(--doux); font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; font-size: 15px; }
.logo { width: 56px; height: 38px; border-radius: 8px; background: rgba(255,255,255,.92) center/80% no-repeat;
  display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #1c2740; flex: none; }
.nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 18px; font-weight: 600; }
.groupe { color: var(--doux); font-size: 13px; font-weight: 400; }
.vide { color: var(--doux); padding: 16px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 22px 18px; border-top: 1px solid var(--ligne); }

.bouton { padding: 8px 14px; border-radius: 10px; border: 2px solid transparent;
  background: rgba(255,255,255,.1); cursor: pointer; font-size: 15px; }
.bouton:hover, .bouton:focus-visible, .bouton:focus { border-color: var(--accent); outline: none; }
.bouton.principal { background: var(--accent); color: #111; font-weight: 700; }

/* Bandeau d'information en bas, façon télé */
.bandeau { position: absolute; z-index: 1; left: 0; right: 0; bottom: 0;
  padding: 60px 40px 30px; display: flex; align-items: center; gap: 18px;
  background: linear-gradient(transparent, rgba(0,0,0,.85)); transition: opacity .4s, left .25s; }
.app:not(.cache-liste) .bandeau { left: var(--largeur-liste); }
.bandeau.discret { opacity: 0; pointer-events: none; }
.bandeau .logo { width: 84px; height: 56px; border-radius: 10px; font-size: 16px; }
.bandeau .infos { flex: 1; min-width: 0; }
.bandeau .titre { font-size: 30px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bandeau .sous-titre { color: var(--doux); font-size: 16px; display: flex; gap: 10px; align-items: center; }
.qualite { background: rgba(255,255,255,.15); color: var(--texte); border-radius: 6px; padding: 1px 8px;
  font-size: 13px; font-weight: 700; letter-spacing: .5px; }
.qualite:empty { display: none; }
.boutons-web { display: flex; gap: 8px; }
html.appli .boutons-web { display: none; }
html.appli #recherche { display: none; } /* taper au clavier de la télécommande : non */
html:not(.appli) .entete .aide { display: none; }

.message { position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  padding: 24px 15%; color: var(--texte); font-size: 22px; pointer-events: none; background: #000; transition: left .25s; }
.app:not(.cache-liste) .message { left: var(--largeur-liste); }
.message.chargement { background: none; text-shadow: 0 2px 8px #000; }
.message.erreur { color: #ffc2c2; }
.message[hidden] { display: none; }

/* Lecteur natif de l'appli Android : la vidéo est dessinée sous la page. */
html.natif, html.natif body, html.natif main { background: transparent; }
html.natif video { display: none; }

dialog { background: #131c2e; color: var(--texte); border: 1px solid var(--ligne);
  border-radius: 14px; padding: 20px; width: min(520px, calc(100vw - 32px)); }
dialog::backdrop { background: #000a; }
dialog h2 { margin: 0 0 12px; font-size: 18px; }
dialog p { color: var(--doux); margin: 6px 0 14px; font-size: 14px; }
dialog label { display: block; margin: 14px 0 6px; font-weight: 600; }
dialog input[type=url], dialog textarea { width: 100%; padding: 9px 10px; border-radius: 8px;
  border: 1px solid #24314a; background: #0b1220; }
dialog textarea { min-height: 120px; font-family: ui-monospace, monospace; font-size: 13px; }
dialog .pied { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 18px; }

/* ----- téléphone : vidéo en haut, liste en dessous ----- */
@media (max-width: 760px) {
  .app { display: flex; flex-direction: column; }
  main { position: relative; inset: auto; height: calc(100vw * 9 / 16); flex: none; order: -1; }
  .app.cache-liste main { height: auto; }
  aside { position: static; width: auto; flex: 1; min-height: 0; transform: none; box-shadow: none; background: #0b1220; }
  .app.cache-liste aside { display: none; }
  .app.cache-liste main { flex: 1; aspect-ratio: auto; }
  .app:not(.cache-liste) .bandeau, .app:not(.cache-liste) .message { left: 0; }
  .bandeau { padding: 30px 14px 12px; }
  .bandeau .titre { font-size: 18px; }
  .bandeau .logo { display: none; }
  .message { font-size: 16px; padding: 16px; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="entete"><h1>TV <span>Kosova</span></h1><span class="aide" id="aide">OK : regarder · Retour : masquer</span></div>
    <div class="filtres">
      <input id="recherche" type="search" placeholder="Rechercher une chaîne…" aria-label="Rechercher une chaîne">
      <select id="groupe" aria-label="Catégorie"></select>
    </div>
    <ul id="liste" aria-label="Chaînes"></ul>
    <div class="actions">
      <button class="bouton principal" id="btn-importer">Charger une playlist</button>
      <button class="bouton" id="btn-defaut" title="Revenir à chaines.m3u">Playlist par défaut</button>
    </div>
  </aside>

  <main>
    <video id="video" controls playsinline autoplay poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
    <div class="bandeau" id="bandeau">
      <span class="logo" id="bandeau-logo"></span>
      <div class="infos">
        <div class="titre" id="titre">Choisissez une chaîne</div>
        <div class="sous-titre"><span id="bandeau-groupe"></span><span class="qualite" id="qualite"></span></div>
      </div>
      <div class="boutons-web">
        <button class="bouton" id="btn-liste" title="Afficher / masquer la liste (touche L)">Liste</button>
        <button class="bouton" id="btn-plein" title="Plein écran (touche F)">Plein écran</button>
      </div>
    </div>
    <div class="message" id="message">Choisissez une chaîne dans la liste.</div>
  </main>
</div>

<dialog id="dialogue">
  <form method="dialog">
    <h2>Charger une playlist M3U</h2>
    <p>La playlist reste enregistrée sur cet appareil.</p>

    <label for="fichier">Depuis un fichier (.m3u / .m3u8)</label>
    <input id="fichier" type="file" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,application/vnd.apple.mpegurl">

    <label for="url">Depuis une adresse web</label>
    <input id="url" type="url" placeholder="https://…/playlist.m3u">

    <label for="texte">Ou collez son contenu</label>
    <textarea id="texte" placeholder="#EXTM3U&#10;#EXTINF:-1,Ma chaîne&#10;https://…/live.m3u8"></textarea>

    <div class="pied">
      <button class="bouton" value="annuler">Annuler</button>
      <button class="bouton principal" id="btn-valider" value="ok">Charger</button>
    </div>
  </form>
</dialog>

<script src="hls.min.js"></script>
<script>
"use strict";
const CLE_PLAYLIST = "tvk.playlist";   // texte M3U importé
const CLE_DERNIERE = "tvk.derniere";   // adresse de la dernière chaîne regardée
// Ouverte depuis l'appli Android TV « TV Kosova » (voir android/) ?
const DANS_APPLI = /TVKosovaApp/.test(navigator.userAgent);
// Dans l'appli, la vidéo est lue par le lecteur natif d'Android (ExoPlayer),
// qui décode bien mieux les flux de télé que le lecteur web.
const NATIF = DANS_APPLI && !!window.TVKosova;
if (DANS_APPLI) document.documentElement.classList.add("appli");
if (NATIF) document.documentElement.classList.add("natif");
let enLecture = false;

const $ = (id) => document.getElementById(id);
const video = $("video"), liste = $("liste"), message = $("message");
let chaines = [], visibles = [], courante = -1, hls = null;

/* ---------- stockage (peut être indisponible : navigation privée…) ---------- */
const stock = {
  lire(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  ecrire(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
};

/* ---------- lecture du fichier M3U ---------- */
function analyserM3U(texte) {
  const res = [];
  let info = null;
  for (let ligne of texte.split(/\r?\n/)) {
    ligne = ligne.trim();
    if (!ligne) continue;
    if (ligne.startsWith("#EXTINF")) {
      const virgule = indexHorsGuillemets(ligne, ",");
      const entete = virgule >= 0 ? ligne.slice(0, virgule) : ligne;
      const attrs = {};
      for (const m of entete.matchAll(/([\w-]+)="([^"]*)"/g)) attrs[m[1].toLowerCase()] = m[2];
      info = {
        nom: (virgule >= 0 ? ligne.slice(virgule + 1).trim() : "") || attrs["tvg-name"] || "Sans nom",
        logo: attrs["tvg-logo"] || "",
        groupe: attrs["group-title"] || "",
      };
    } else if (ligne.startsWith("#EXTGRP:")) {
      if (info) info.groupe = ligne.slice(8).trim();
    } else if (ligne.startsWith("#")) {
      continue; // commentaire ou option non gérée
    } else {
      const c = info || { nom: ligne.split("/").pop() || ligne, logo: "", groupe: "" };
      c.url = ligne;
      res.push(c);
      info = null;
    }
  }
  return res;
}
function indexHorsGuillemets(s, car) {
  let dedans = false;
  for (let i = 0; i < s.length; i++) {
    if (s[i] === '"') dedans = !dedans;
    else if (s[i] === car && !dedans) return i;
  }
  return -1;
}

/* ---------- liste des chaînes ---------- */
function chargerTexte(texte) {
  chaines = analyserM3U(texte).map((c, i) => ({ ...c, num: i + 1 }));
  const groupes = [...new Set(chaines.map((c) => c.groupe).filter(Boolean))];
  $("groupe").innerHTML = '<option value="">Toutes les catégories</option>' +
    groupes.map((g) => `<option>${echapper(g)}</option>`).join("");
  $("groupe").hidden = groupes.length < 2;
  afficherListe();
  const derniere = stock.lire(CLE_DERNIERE);
  const i = chaines.findIndex((c) => c.url === derniere);
  if (i >= 0) jouer(i, false);
  // Focus sur une chaîne dès l'ouverture : la télécommande marche tout de suite.
  (liste.querySelector('[aria-current="true"]') || liste.querySelector("button"))?.focus();
  if (!chaines.length) afficherMessage("La playlist ne contient aucune chaîne avec une adresse de flux.", true);
}

function afficherListe() {
  const q = $("recherche").value.trim().toLowerCase();
  const g = $("groupe").value;
  visibles = chaines.filter((c) => (!g || c.groupe === g) && (!q || c.nom.toLowerCase().includes(q)));
  liste.innerHTML = "";
  if (!visibles.length) {
    liste.innerHTML = `<li class="vide">${chaines.length ? "Aucune chaîne ne correspond." : "Aucune chaîne."}</li>`;
    return;
  }
  for (const c of visibles) {
    const idx = chaines.indexOf(c);
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.dataset.idx = idx;
    if (idx === courante) b.setAttribute("aria-current", "true");
    const logo = document.createElement("span");
    logo.className = "logo";
    remplirLogo(logo, c);
    b.innerHTML = `<span class="num">${c.num}</span>`;
    b.append(logo);
    const txt = document.createElement("span");
    txt.className = "nom";
    txt.textContent = c.nom;
    if (c.groupe) { const gr = document.createElement("div"); gr.className = "groupe"; gr.textContent = c.groupe; txt.append(gr); }
    b.append(txt);
    // OK sur la chaîne en cours : on la regarde en grand (liste masquée).
    b.addEventListener("click", () => (idx === courante ? basculerListe(true) : jouer(idx)));
    li.append(b);
    liste.append(li);
  }
}

function remplirLogo(el, c) {
  el.style.backgroundImage = c.logo ? `url("${c.logo.replace(/"/g, "%22")}")` : "";
  el.textContent = c.logo ? "" : c.nom.replace(/^(R?TV|TV)\s+/i, "").slice(0, 3).toUpperCase();
}

function echapper(s) {
  return s.replace(/[&<>"]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
}

/* ---------- lecture vidéo ---------- */
function jouer(idx, focus = true) {
  const c = chaines[idx];
  if (!c) return;
  courante = idx;
  stock.ecrire(CLE_DERNIERE, c.url);
  $("titre").textContent = `${c.num}  ${c.nom}`;
  $("bandeau-groupe").textContent = c.groupe;
  $("qualite").textContent = "";
  remplirLogo($("bandeau-logo"), c);
  enLecture = false;
  document.title = `${c.nom} · TV Kosova`;
  for (const b of liste.querySelectorAll("button")) {
    if (+b.dataset.idx === idx) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
  }
  if (focus) liste.querySelector(`button[data-idx="${idx}"]`)?.focus();
  afficherMessage("Chargement…");
  montrerBandeau();

  if (hls) { hls.destroy(); hls = null; }
  video.removeAttribute("src");

  if (NATIF) { window.TVKosova.jouer(c.url); return; }

  if (!DANS_APPLI && location.protocol === "https:" && c.url.startsWith("http:")) {
    afficherMessage("Ce flux est en « http » : il ne peut pas être lu depuis une page sécurisée (https). " +
      "Cherchez une adresse en « https » pour cette chaîne.", true);
    return;
  }

  const estHls = /\.m3u8(\?|$)/i.test(c.url) || !/\.(mp4|webm|ogg|mp3)(\?|$)/i.test(c.url);
  if (estHls && window.Hls && Hls.isSupported()) {
    hls = new Hls({ enableWorker: true, lowLatencyMode: true, capLevelToPlayerSize: false });
    // Meilleure qualité disponible dès le départ (les niveaux vont du plus
    // faible au plus fort) ; hls.js redescend seul si la connexion ne suit pas.
    hls.on(Hls.Events.MANIFEST_PARSED, () => { hls.startLevel = hls.levels.length - 1; });
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; }
      afficherMessage(explicationErreur(d), true);
    });
    hls.loadSource(c.url);
    hls.attachMedia(video);
  } else {
    video.src = c.url; // Safari, iPhone et nombreuses télés lisent le HLS nativement
  }
  video.play().catch(() => {});
}

function explicationErreur(d) {
  const code = d.response && d.response.code;
  if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
    if (code === 403 || code === 401) return "Accès refusé par la chaîne (erreur " + code + "). Le flux est peut-être réservé au Kosovo ou l'adresse a expiré.";
    if (code === 404) return "Adresse introuvable (erreur 404). Le lien du flux a sans doute changé.";
    return "Impossible de joindre le flux. Soit il est hors ligne, soit la chaîne bloque la lecture depuis un autre site (CORS). " +
      "Essayez avec Safari, l'appli VLC, ou une autre adresse.";
  }
  return "Le flux ne peut pas être lu (" + (d.details || "erreur inconnue") + ").";
}

function afficherMessage(txt, erreur = false) {
  message.textContent = txt;
  message.classList.toggle("erreur", erreur);
  message.classList.toggle("chargement", txt === "Chargement…");
  message.hidden = !txt;
}
video.addEventListener("playing", () => { enLecture = true; afficherMessage(""); montrerBandeau(); });
video.addEventListener("resize", () => afficherQualite(video.videoHeight));
video.addEventListener("waiting", () => afficherMessage("Chargement…"));
video.addEventListener("error", () => {
  if (!hls && courante >= 0) afficherMessage("Le flux ne peut pas être lu sur cet appareil ou n'est pas disponible.", true);
});

function afficherQualite(h) {
  $("qualite").textContent = !h ? "" : h >= 2000 ? "4K" : h >= 1000 ? "HD 1080p" : h >= 700 ? "HD 720p" : h + "p";
}

/* Événements du lecteur natif de l'appli Android. */
window.tvEvenement = function (type, a, b) {
  if (type === "lecture") { enLecture = true; afficherMessage(""); montrerBandeau(); }
  else if (type === "attente") afficherMessage("Chargement…");
  else if (type === "qualite") afficherQualite(a);
  else if (type === "erreur") {
    enLecture = false;
    afficherMessage(b === 404 ? "Adresse introuvable (erreur 404). Le lien du flux a sans doute changé."
      : b === 403 || b === 401 ? "Accès refusé par la chaîne (erreur " + b + "). Le flux est peut-être réservé au Kosovo."
      : b ? "La chaîne ne répond pas (erreur " + b + ")."
      : a === "decodage" ? "Cet appareil ne sait pas décoder la vidéo de cette chaîne."
      : "La chaîne ne répond pas : elle est peut-être hors ligne pour le moment.", true);
  }
};

function zapper(pas) {
  if (!chaines.length) return;
  const pos = visibles.indexOf(chaines[courante]);
  const base = visibles.length ? visibles : chaines;
  const suivant = base[((pos < 0 ? (pas > 0 ? -1 : 0) : pos) + pas + base.length) % base.length];
  jouer(chaines.indexOf(suivant));
}

/* ---------- bandeau, liste, plein écran ---------- */
let minuterie, minuterieListe;
function montrerBandeau() {
  $("bandeau").classList.remove("discret");
  clearTimeout(minuterie);
  minuterie = setTimeout(() => { if (enLecture) $("bandeau").classList.add("discret"); }, 5000);
  // Écran large : la liste se range seule quand on regarde sans toucher à rien.
  clearTimeout(minuterieListe);
  minuterieListe = setTimeout(() => {
    if (enLecture && innerWidth > 760 && !$("dialogue").open &&
        !document.activeElement.matches("input, select, textarea")) basculerListe(true);
  }, 12000);
}
document.querySelector("main").addEventListener("pointermove", montrerBandeau);

function basculerListe(force) {
  const cache = $("app").classList.toggle("cache-liste", force);
  if (!cache) (liste.querySelector('[aria-current="true"]') || liste.querySelector("button"))?.focus();
}
function pleinEcran() {
  if (DANS_APPLI) { basculerListe(); return; } // l'appli est déjà en plein écran
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
  basculerListe(!document.fullscreenElement);
}
$("btn-liste").onclick = () => basculerListe();
$("btn-plein").onclick = pleinEcran;
$("recherche").addEventListener("input", afficherListe);
$("groupe").addEventListener("change", afficherListe);

/* ---------- télécommande et clavier ---------- */
document.addEventListener("keydown", (e) => {
  if ($("dialogue").open) return;
  const dansChamp = e.target.matches("input, select, textarea");
  const listeCachee = $("app").classList.contains("cache-liste");
  switch (e.key) {
    case "ArrowDown": case "ArrowUp": {
      if (listeCachee) { zapper(e.key === "ArrowDown" ? 1 : -1); break; }
      // Parcours vertical : recherche, catégorie, chaînes, boutons du bas.
      const ordre = [$("recherche"), $("groupe"), ...liste.querySelectorAll("button"),
        $("btn-importer"), $("btn-defaut")].filter((el) => !el.hidden && el.offsetParent !== null);
      const pos = ordre.indexOf(document.activeElement);
      const cible = pos < 0 ? (liste.querySelector('[aria-current="true"]') || ordre[2])
        : ordre[Math.max(0, Math.min(ordre.length - 1, pos + (e.key === "ArrowDown" ? 1 : -1)))];
      cible?.focus();
      cible?.scrollIntoView({ block: "nearest" });
      break;
    }
    case "Enter":
      if (!listeCachee) return; // OK natif sur l'élément sélectionné
      basculerListe(false); break;
    case "ChannelUp": case "PageUp": zapper(-1); break;
    case "ChannelDown": case "PageDown": zapper(1); break;
    case "MediaPlayPause":
      if (NATIF) window.TVKosova.basculerPause(); else video.paused ? video.play() : video.pause();
      break;
    case "Escape": case "GoBack": case "BrowserBack":
      if (dansChamp) { e.target.blur(); break; }
      basculerListe(); break;
    default:
      if (dansChamp) return;
      if (e.key === "f" || e.key === "F") pleinEcran();
      else if (e.key === "l" || e.key === "L") basculerListe();
      else if (/^[0-9]$/.test(e.key)) composerNumero(e.key);
      else return;
  }
  e.preventDefault();
  montrerBandeau();
});

let numero = "", minuterieNum;
function composerNumero(ch) {
  numero += ch;
  $("titre").textContent = "Chaîne " + numero + "…";
  clearTimeout(minuterieNum);
  minuterieNum = setTimeout(() => {
    const i = chaines.findIndex((c) => c.num === +numero);
    numero = "";
    if (i >= 0) jouer(i); else if (courante >= 0) jouer(courante, false);
  }, 1200);
}

/* ---------- import de playlist ---------- */
const dialogue = $("dialogue");
$("btn-importer").onclick = () => { $("fichier").value = ""; $("url").value = ""; $("texte").value = ""; dialogue.showModal(); };
dialogue.addEventListener("close", async () => {
  if (dialogue.returnValue !== "ok") return;
  try {
    let texte = $("texte").value.trim();
    const f = $("fichier").files[0];
    if (f) texte = await f.text();
    else if (!texte && $("url").value) {
      const r = await fetch($("url").value);
      if (!r.ok) throw new Error("erreur " + r.status);
      texte = await r.text();
    }
    if (!texte) return;
    if (!analyserM3U(texte).length) { alert("Ce fichier ne contient aucune chaîne lisible."); return; }
    stock.ecrire(CLE_PLAYLIST, texte);
    chargerTexte(texte);
  } catch (err) {
    alert("Impossible de charger la playlist : " + err.message +
      "\nSi elle vient d'un autre site, téléchargez-la puis choisissez le fichier.");
  }
});
$("btn-defaut").onclick = () => {
  if (!confirm("Remplacer la playlist actuelle par chaines.m3u ?")) return;
  stock.ecrire(CLE_PLAYLIST, null);
  demarrer();
};

/* ---------- démarrage ---------- */
async function demarrer() {
  const enregistree = stock.lire(CLE_PLAYLIST);
  if (enregistree) { chargerTexte(enregistree); return; }
  try {
    const r = await fetch("chaines.m3u", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    chargerTexte(await r.text());
  } catch (e) {
    chargerTexte("");
    afficherMessage("Aucune playlist trouvée. Cliquez sur « Charger une playlist ».", true);
  }
}
/* Touche Retour dans l'appli Android : renvoie true si la page l'a utilisée,
   false pour laisser l'appli se fermer. */
window.tvRetour = function () {
  if ($("dialogue").open) { $("dialogue").close(); return true; }
  if (document.activeElement && document.activeElement.matches("input, select, textarea")) {
    document.activeElement.blur(); basculerListe(false); return true;
  }
  if ($("app").classList.contains("cache-liste")) { basculerListe(false); return true; }
  return false;
};

demarrer();
